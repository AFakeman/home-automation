---
# Also called directly by playbook-renew-certificate.yml.
- name: Validate nginx configuration before reloading
  become: true
  ansible.builtin.command:
    argv:
      - "{{ nginx_binary }}"
      - -t
      - -c
      - "{{ nginx_config_dir }}/nginx.conf"
  changed_when: false

- name: Send HUP to MacPorts nginx
  become: true
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - kill
      - HUP
      - "system/{{ nginx_launchd_service }}"
