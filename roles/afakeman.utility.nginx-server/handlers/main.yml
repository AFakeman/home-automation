---
- name: Reload nginx virtual hosts
  become: true
  ansible.builtin.command:
    argv:
      - "{{ nginx_binary }}"
      - -t
      - -c
      - "{{ nginx_config_dir }}/nginx.conf"
  changed_when: false

- name: Signal MacPorts nginx for virtual hosts
  listen: Reload nginx virtual hosts
  become: true
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - kill
      - HUP
      - "system/{{ nginx_launchd_service }}"
