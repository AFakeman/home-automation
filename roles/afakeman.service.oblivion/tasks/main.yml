---
- name: Oblivion | Ensure CGI directory
  become: true
  ansible.builtin.file:
    path: "{{ oblivion_cgi_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: '0755'

- name: Oblivion | Install dialogue and CGI scripts
  become: true
  ansible.builtin.copy:
    src: "{{ item.name }}"
    dest: "{{ oblivion_cgi_dir }}/{{ item.name }}"
    mode: "{{ item.mode }}"
    owner: "{{ ansible_user }}"
    group: admin
  loop:
    - name: oblivion_dialogue.txt
      mode: '0644'
    - name: oblivion.py
      mode: '0755'
    - name: oblivion_tts.py
      mode: '0755'
